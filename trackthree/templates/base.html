<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Oiraboot — Scholarship Atlas{% endblock %}</title>

  <!-- Typography & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <a href="/" onclick="if(!window.location.pathname.startsWith('/track3-atlas')){return true;}event.preventDefault();window.location.href='/track3-atlas/';" style="text-decoration: none; display: flex; align-items: center;" title="Oiraboot — Official OONORI System">
          <img src="{{ url_for('static', filename='img/oiraboot_logo_tight_black.png') }}" alt="Oiraboot" class="brand-logo-img brand-logo-light" />
          <img src="{{ url_for('static', filename='img/oiraboot_logo_tight_white.png') }}" alt="Oiraboot" class="brand-logo-img brand-logo-dark" />
        </a>
      </div>

      <div class="nav-actions">
        <!-- Module Navigation Links -->
        <a href="/" onclick="if(!window.location.pathname.startsWith('/track3-atlas')){event.preventDefault();window.location.href=window.location.protocol+'//'+window.location.hostname+':5000/';}" class="pill-btn" title="Return to Oiraboot Suite">
          <i data-lucide="layout-grid" class="icon-sm text-crimson"></i>
          <span>Oiraboot Suite</span>
        </a>
        <a href="/" onclick="if(window.location.pathname.startsWith('/track3-atlas')){event.preventDefault();window.location.href='/track3-atlas/';}" class="pill-btn {% if request.path == '/' %}active{% endif %}" title="Track 3: Scholarship Atlas">
          <i data-lucide="award" class="icon-sm text-crimson"></i>
          <span>Scholarship Atlas</span>
        </a>
        <a href="/track1" onclick="if(window.location.pathname.startsWith('/track3-atlas')){event.preventDefault();window.location.href='/track1-studio/';}" class="pill-btn {% if request.path == '/track1' %}active{% endif %}" title="AI Engine">
          <i data-lucide="file-search" class="icon-sm text-crimson"></i>
          <span>AI Engine</span>
        </a>

        <!-- Language Switch -->
        <button id="lang-btn" class="pill-btn" onclick="toggleLanguage()" title="Switch Language">
          <i data-lucide="languages" class="icon-sm text-crimson"></i>
          <span id="lang-text">বাংলা</span>
        </button>

        <!-- Theme Switch -->
        <button id="theme-btn" class="pill-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
          <i id="theme-icon" data-lucide="moon" class="icon-sm text-crimson"></i>
          <span id="theme-text">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Shell -->
  <main class="app-shell">
    {% block content %}{% endblock %}
  </main>

  <!-- Minimal Official OONORI Footer -->
  <footer class="oonori-footer">
    <div class="oonori-footer-inner">
      <span><strong>OONORI</strong> · This system is an official <strong>OONORI</strong> system. All rights to this system and codebase are reserved to <strong>OONORI</strong>.</span>
      <span class="oonori-footer-copy">&copy; 2026 OONORI</span>
    </div>
  </footer>

  <!-- Main JS -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
