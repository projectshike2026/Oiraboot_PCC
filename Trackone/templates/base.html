<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Document Intelligence Studio | Track 1 RAG & Quiz{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-badge">
        <img src="/static/img/oiraboot_logo_tight_black.png" alt="Oiraboot" style="height:36px;width:auto;object-fit:contain;" />
      </div>
    </div>

    <!-- Center Navigation Tabs -->
    <nav class="nav-tabs" role="tablist">
      <button class="nav-tab active" data-tab="chat" role="tab" id="tab-btn-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tab-icon">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="tab-label" data-i18n="navChat">Document Chat</span>
      </button>

      <button class="nav-tab" data-tab="quiz" role="tab" id="tab-btn-quiz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tab-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span class="tab-label" data-i18n="navQuiz">Quiz Studio</span>
      </button>

      <button class="nav-tab" data-tab="reader" role="tab" id="tab-btn-reader">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tab-icon">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        <span class="tab-label" data-i18n="navReader">Page Reader</span>
      </button>

      <button class="nav-tab" data-tab="vault" role="tab" id="tab-btn-vault">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tab-icon">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
        <span class="tab-label" data-i18n="navVault">Document Vault</span>
      </button>
    </nav>

    <!-- Header Actions -->
    <div class="header-right">
      <div class="vault-status-pill" id="vault-status-pill" title="Active PDFs in RAG context">
        <span class="status-dot"></span>
        <span id="active-docs-badge">{{ active_doc_count }} PDFs Active</span>
      </div>

      <!-- Language Toggle (EN / BN) -->
      <button class="icon-btn" id="lang-toggle-btn" title="Toggle Language (English / বাংলা)">
        <span id="lang-label" class="lang-text">বাংলা</span>
      </button>

      <!-- Theme Toggle -->
      <button class="icon-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="app-layout">
    {% block content %}{% endblock %}
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
