{% extends "base.html" %}

{% block title %}500 — System Notice | Oiraboot (ঐরাবত){% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4">
  <div class="surface-card rounded-2xl p-10 max-w-md w-full text-center space-y-5">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-crimson-soft text-crimson flex items-center justify-center">
      <i data-lucide="shield-alert" class="w-8 h-8"></i>
    </div>
    <div class="space-y-1.5">
      <span class="font-mono text-xs uppercase tracking-widest text-crimson font-bold">{{ code or 'Notice' }}</span>
      <h1 class="font-athens text-2xl font-bold text-main">Processing Notice</h1>
      <p class="text-xs text-muted leading-relaxed">{{ error or 'An unexpected error occurred. State has been preserved.' }}</p>
    </div>
    <a href="/" class="btn-primary w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2">
      <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      <span>Return to Overview</span>
    </a>
  </div>
</div>
{% endblock %}
