{% extends "base.html" %}

{% block title %}404 — Page Not Found | Oiraboot (ঐরাবত){% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4">
  <div class="surface-card rounded-2xl p-10 max-w-md w-full text-center space-y-5">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-crimson-soft text-crimson flex items-center justify-center">
      <i data-lucide="compass" class="w-8 h-8"></i>
    </div>
    <div class="space-y-1.5">
      <span class="font-mono text-xs uppercase tracking-widest text-crimson font-bold">Error 404</span>
      <h1 class="font-athens text-2xl font-bold text-main">Out of Scope</h1>
      <p class="text-xs text-muted leading-relaxed">The requested page or studio workspace could not be found within the Oiraboot archive.</p>
    </div>
    <a href="/" class="btn-primary w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Return to Overview</span>
    </a>
  </div>
</div>
{% endblock %}
