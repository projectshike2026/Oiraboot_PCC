services:
  - type: web
    name: pciu-academic-suite
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CHOSEN_TRACK
        value: "all"
      - key: LLM_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gemini-2.0-flash"
      - key: DB_PATH
        value: /tmp/app.db
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: MOCK_LLM
        value: "0"
